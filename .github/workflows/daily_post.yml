name: Daily Content Generator

# ──────────────────────────────────────────────────────────────
#  Triggers
#  • Cron  : 03:30 UTC every day  →  09:00 AM IST
#  • Manual: workflow_dispatch for ad-hoc / test runs
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST

  workflow_dispatch:        # Manual trigger from GitHub Actions UI

# ──────────────────────────────────────────────────────────────
#  Prevent duplicate runs if a previous job is still running
# ──────────────────────────────────────────────────────────────
concurrency:
  group: daily-content-generator
  cancel-in-progress: false   # Let the current run finish; don't cancel it

jobs:
  generate-and-post:
    name: Generate Carousel & Post to Telegram
    runs-on: ubuntu-latest

    # Give the job write permission to push topics.json back to the repo
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 ensures git push works correctly with branch history
          fetch-depth: 0
          # Use a PAT if your repo has branch protection rules that block
          # the default GITHUB_TOKEN from pushing.  For most public/private
          # repos the default token is sufficient.
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ─────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"           # Cache pip packages between runs

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Verify topics.json has remaining topics ──────────────────────
      - name: Check topics list is non-empty
        run: |
          python - <<'EOF'
          import json, sys
          with open("topics.json") as f:
              topics = json.load(f)
          if not topics:
              print("::error::topics.json is empty — add more topics before the next run.")
              sys.exit(1)
          print(f"✅  {len(topics)} topic(s) remaining. Next topic: '{topics[0]}'")
          EOF

      # ── 5. Run the main script ──────────────────────────────────────────
      - name: Run content generator
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # ── 6. Commit the updated topics.json back to the repo ─────────────
      #
      #  CRITICAL: main.py pops the first topic from topics.json.
      #  We must commit + push that change so the next scheduled run
      #  doesn't repeat the same topic.
      #
      - name: Commit updated topics.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add topics.json

          # Only commit if topics.json actually changed.
          # 'git diff --cached --quiet' exits 0 when there is nothing staged.
          if git diff --cached --quiet; then
            echo "ℹ️  topics.json was not modified — nothing to commit."
          else
            git commit -m "chore(bot): consume topic for $(date -u +'%Y-%m-%d') [skip ci]"
            git push
            echo "✅  topics.json committed and pushed."
          fi

      # ── 7. Upload generated slides as workflow artifacts ────────────────
      #  (Optional but useful for debugging without needing Telegram)
      - name: Upload slide images
        if: always()                          # Upload even if Telegram step failed
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: output/slide_*.jpg
          retention-days: 7                   # Auto-delete after 7 days
