name: Daily Content Generator

# ──────────────────────────────────────────────────────────────
#  Triggers
#  • Cron  : 03:30 UTC every day  →  09:00 AM IST
#  • Manual: workflow_dispatch for ad-hoc / test runs
# ──────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST

  workflow_dispatch:        # Manual trigger from GitHub Actions UI

# ──────────────────────────────────────────────────────────────
#  Prevent duplicate runs if a previous job is still running
# ──────────────────────────────────────────────────────────────
concurrency:
  group: daily-content-generator
  cancel-in-progress: false   # Let the current run finish; don't cancel it

jobs:
  generate-and-post:
    name: Generate Carousel & Post to Telegram
    runs-on: ubuntu-latest

    # Opt in to Node.js 24 to silence deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # Give the job write permission to push topics.json back to the repo
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup ─────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # ── 4. Install Playwright browser ───────────────────────────────────
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      # ── 5. Verify topics.json has remaining topics ──────────────────────
      - name: Check topics list is non-empty
        run: |
          python - <<'EOF'
          import json, sys
          with open("topics.json") as f:
              topics = json.load(f)
          if not topics:
              print("::error::topics.json is empty — add more topics before the next run.")
              sys.exit(1)
          print(f"✅  {len(topics)} topic(s) remaining. Next topic: '{topics[0]}'")
          EOF

      # ── 6. Run the main script ──────────────────────────────────────────
      - name: Run content generator
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # ── 7. Commit the updated topics.json back to the repo ─────────────
      - name: Commit updated topics.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add topics.json

          if git diff --cached --quiet; then
            echo "ℹ️  topics.json was not modified — nothing to commit."
          else
            git commit -m "chore(bot): consume topic for $(date -u +'%Y-%m-%d') [skip ci]"
            git push
            echo "✅  topics.json committed and pushed."
          fi

      # ── 8. Upload generated slides as workflow artifacts ────────────────
      - name: Upload slide images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: output/slide_*.png
          retention-days: 7
